name: Build PCA10059 Dongle for Corne Keyboard

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-dongle:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    env:
      BOARD: nrf52840dongle_nrf52840
      SHIELD: corne_dongle_xiao
      ARTIFACT_NAME: pca10059_corne_dongle
      SNIPPET: studio-rpc-usb-uart
      CONFIG_DIR: config
    steps:
      - name: Checkout ZMK Config
        uses: actions/checkout@v4

      - name: Prepare Build Directory
        run: |
          echo "BUILD_DIR=$(mktemp -d)" >> $GITHUB_ENV

      - name: West Init
        working-directory: ${{ github.workspace }}
        run: west init -l .

      - name: West Update
        working-directory: ${{ github.workspace }}
        run: west update --fetch-opt=--filter=tree:0

      - name: Zephyr Export
        working-directory: ${{ github.workspace }}
        run: west zephyr-export

      - name: Build ZMK Firmware
        working-directory: ${{ github.workspace }}
        run: |
          west build -s zmk/app -d "${BUILD_DIR}" -b $BOARD -- -DZMK_CONFIG=${CONFIG_DIR} -DSHIELD="$SHIELD"

      - name: Collect Firmware Artifact
        run: |
          mkdir -p "${BUILD_DIR}/artifacts"
          cp "${BUILD_DIR}/zephyr/zmk.uf2" "${BUILD_DIR}/artifacts/${ARTIFACT_NAME}.uf2"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.BUILD_DIR }}/artifacts/${{ env.ARTIFACT_NAME }}.uf2
